[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/calendar.ics"
  to = "/.netlify/functions/calendar-ics"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
